[package]
name = "senviok"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async Rust client for the Senviok messaging API (email, SMS, WhatsApp)."
license = "MIT"
readme = "README.md"
homepage = "https://senviok.live"
documentation = "https://docs.rs/senviok"
keywords = ["senviok", "email", "sms", "whatsapp", "api"]
categories = ["api-bindings", "email", "web-programming"]
autoexamples = false
exclude = [".env", ".github"]
repository = "https://github.com/Chekwube-Manuel/senviok-Rust-SDK"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "send_email"

[[example]]
name = "send_sms"

[[example]]
name = "send_whatsapp"

[[example]]
name = "templates"

[[example]]
name = "domains"

[[example]]
name = "audiences"

[[example]]
name = "suppressions"

[[example]]
name = "list_messages"

[[example]]
name = "webhooks"
